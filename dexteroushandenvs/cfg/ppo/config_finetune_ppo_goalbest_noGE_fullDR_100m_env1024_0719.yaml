seed: -1
prevent_log_overwrite: True

clip_observations: 5.0
clip_actions: 1.0

policy:
  pi_hid_sizes: [1024, 1024, 512]
  vf_hid_sizes: [1024, 1024, 512]
  activation: elu

learn:
  agent_name: finetune_ppo_goalbest_noGE_fullDR_100m_env1024_0719
  test: False
  resume: 0
  save_interval: 500
  print_log: True

  # 1024 envs * 8 rollout steps * 12207 iterations ~= 100M environment steps.
  max_iterations: 12207

  cliprange: 0.2
  ent_coef: 0
  nsteps: 8
  noptepochs: 5
  nminibatches: 4
  max_grad_norm: 1
  optim_stepsize: 3.e-4
  schedule: adaptive
  desired_kl: 0.016
  gamma: 0.96
  lam: 0.95
  init_noise_std: 0.8

  log_interval: 1
  asymmetric: False
