seed: 4
prevent_log_overwrite: True

clip_observations: 5.0
clip_actions: 1.0

policy:
  pi_hid_sizes: [1024, 1024, 512]
  vf_hid_sizes: [1024, 1024, 512]
  activation: elu

learn:
  agent_name: ppo_3obj_legacyFullDR_ablationC_200m_env1024_actor5e5_critic1e4_fixed_0805
  test: False
  resume: 0
  save_interval: 500
  print_log: True

  # 1024 envs * 8 rollout steps * 24415 iterations = 200,007,680 steps.
  max_iterations: 24415

  cliprange: 0.1
  ent_coef: 0.001
  nsteps: 8
  noptepochs: 3
  nminibatches: 4
  max_grad_norm: 0.5
  optim_stepsize: 1.e-4
  actor_optim_stepsize: 5.e-5
  critic_optim_stepsize: 1.e-4
  schedule: fixed
  desired_kl: 0.01
  gamma: 0.96
  lam: 0.95
  init_noise_std: 0.8
  value_loss_coef: 1.0
  use_clipped_value_loss: True

  log_interval: 1
  asymmetric: False
