seed: 4
prevent_log_overwrite: True

clip_observations: 5.0
clip_actions: 1.0

policy:
  pi_hid_sizes: [1024, 1024, 512]
  vf_hid_sizes: [1024, 1024, 512]
  activation: elu

learn:
  agent_name: ppo_3obj_officialreward_terminal_goal030_officialLinearDR_800m_officialHyperparams_0812
  test: False
  resume: 0
  save_interval: 500
  print_log: True

  # 1024 envs * 8 rollout steps * 97657 iterations = 800,006,144 steps.
  max_iterations: 97657

  cliprange: 0.2
  ent_coef: 0.0
  nsteps: 8
  noptepochs: 5
  nminibatches: 4
  max_grad_norm: 1.0
  optim_stepsize: 3.e-4
  actor_optim_stepsize: 3.e-4
  critic_optim_stepsize: 3.e-4
  schedule: adaptive
  desired_kl: 0.016
  gamma: 0.96
  lam: 0.95
  init_noise_std: 0.8
  log_interval: 1
  asymmetric: False
