# if given, will override the device setting in gym.
env:
  env_name: "allegro_hand_dynamic_handover"
  numEnvs: 2048
  envSpacing: 1.25
  episodeLength: 30
  enableDebugVis: False
  aggregateMode: 1
  enableCameraSensors: False
  cameraDebug: False
  pointCloudDebug: False

  stiffnessScale: 1.0
  forceLimitScale: 1.0
  useRelativeControl: False
  dofSpeedScale: 100.0
  actionsMovingAverage: 1.0
  controlFrequencyInv: 3 # 60 Hz simulation / 20 Hz control

  startPositionNoise: 0.0
  startRotationNoise: 0.0

  resetPositionNoise: 0.0
  resetRotationNoise: 0.0
  resetDofPosRandomInterval: 0.
  resetDofVelRandomInterval: 0.0

  distRewardScale: 10.0
  rotRewardScale: 1.0
  rotEps: 0.1
  actionPenaltyScale: -0.003
  reachGoalBonus: 0
  fallDistance: 0.4
  fallPenalty: 0.0

  objectType: "egg" # can be block, egg or pen
  observationType: "full_state" #
  handAgentIndex: "[[0, 1, 2, 3, 4, 5]]"
  asymmetric_observations: True
  successTolerance: 0.1
  printNumSuccesses: False
  maxConsecutiveSuccesses: 0
  # HR/SR diagnostic thresholds. These do not affect the reward; they only affect
  # train_episode_hr, train_episode_sr, and debug_hrsr_* TensorBoard metrics.
  hitDistThreshold: 0.25
  catchDistThreshold: 0.20
  hitContactForceThreshold: 0.05
  catchContactForceThreshold: 0.05
  catchSpeedThreshold: 1.5
  catchHoldSteps: 3
  objectHeightThreshold: 0.15

  asset:
    assetRoot: "../assets"
    assetFileName: "mjcf/open_ai_assets/hand/shadow_hand.xml"
    assetFileNameBlock: "urdf/objects/cube_multicolor.urdf"
    assetFileNameEgg: "mjcf/open_ai_assets/hand/egg.xml"
    assetFileNamePen: "mjcf/open_ai_assets/hand/pen.xml"

task:
  randomize: True
  randomization_params:
    frequency: 600   # Define how many simulation steps between generating new randomizations
    observations:
      range: [0, .002] # range for the white noise
      range_correlated: [0, .001 ] # range for correlated noise, refreshed with freq `frequency`
      operation: "additive"
      distribution: "gaussian"
    actions:
      range: [0., .05]
      range_correlated: [0, .015] # range for correlated noise, refreshed with freq `frequency`
      operation: "additive"
      distribution: "gaussian"
    sim_params:
      gravity:
        range: [0, 0.4]
        operation: "additive"
        distribution: "gaussian"
    actor_params:
      hand:
        color: True
        rigid_body_properties:
          mass:
            range: [0.5, 1.5]
            operation: "scaling"
            distribution: "uniform"
        rigid_shape_properties:
          friction:
            num_buckets: 250
            range: [0.7, 1.3]
            operation: "scaling"
            distribution: "uniform"
      object:
        scale:
          range: [0.95, 1.05]
          operation: "scaling"
          distribution: "uniform"
        rigid_body_properties:
          mass:
            range: [0.5, 1.5]
            operation: "scaling"
            distribution: "uniform"
        rigid_shape_properties:
          friction:
            num_buckets: 250
            range: [0.5, 1.5]
            operation: "scaling"
            distribution: "uniform"

sim:
  dt: 0.016666666666666666
  substeps: 2
  physx:
    num_threads: 16
    solver_type: 1  # 0: pgs, 1: tgs
    num_position_iterations: 8
    num_velocity_iterations: 0
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 200.0
    gpu_found_lost_aggregate_pairs_capacity: 16000000
    contact_collection: 1 # 0: CC_NEVER (don't collect contact info), 1: CC_LAST_SUBSTEP (collect only contacts on last substep), 2: CC_ALL_SUBSTEPS (default - all contacts)
  flex:
    num_outer_iterations: 5
    num_inner_iterations: 20
    warm_start: 0.8
    relaxation: 0.75
